[package]
name = "taurus-desktop"
version = "0.1.0"
edition.workspace = true
# Own MSRV: slint 1.18 needs Rust 1.92 and tray-icon 0.26 needs 1.90, above the
# workspace's 1.89. CI checks this crate with 1.92 and the rest with 1.89.
rust-version = "1.92"
license.workspace = true
repository.workspace = true
build = "build.rs"

[[bin]]
name = "hyades"
path = "src/main.rs"

[dependencies]
taurus-core = { workspace = true }
taurus-icon = { workspace = true }
slint = { workspace = true }
interprocess = { workspace = true }
tokio = { workspace = true }
futures-util = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
serde_json = { workspace = true }
directories = { workspace = true }
url = { workspace = true }
notify-rust = { workspace = true }
arboard = { workspace = true }
auto-launch = { workspace = true }
opener = { workspace = true }
rfd = { workspace = true }
chrono = { workspace = true }
# In-app updates: the running version, and unpacking the macOS bundle.
semver = { workspace = true }
flate2 = { workspace = true }
tar = { workspace = true }
# Linux uses the D-Bus StatusNotifier backend (no GTK); the feature does
# nothing on Windows and macOS.
tray-icon = { workspace = true, features = ["ksni"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { workspace = true }

[build-dependencies]
slint-build = { workspace = true }

[dev-dependencies]
i-slint-backend-testing = { workspace = true }
tempfile = { workspace = true }
taurus-testkit = { workspace = true }
