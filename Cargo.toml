[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]
exclude = ["third_party"]

[workspace.package]
edition = "2024"
rust-version = "1.89"
license = "GPL-3.0-or-later"
repository = "https://github.com/nikethai/taurus"

[workspace.dependencies]
# Internal crates
taurus-core = { path = "crates/taurus-core" }
taurus-testkit = { path = "crates/taurus-testkit" }

# Desktop app (apps/taurus-desktop; needs Rust 1.92, see its Cargo.toml)
slint = "1.18"
slint-build = "1.18"
i-slint-backend-testing = "1.18"
tray-icon = { version = "0.26", default-features = false }
notify-rust = "4.18"
arboard = "3.7"
auto-launch = "0.6"
interprocess = { version = "2.4", features = ["tokio"] }
opener = { version = "0.9", features = ["reveal"] }
rfd = "0.17"
# Local time of finished downloads (already in the tree through Slint).
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Linux: asks D-Bus whether a StatusNotifier host (tray) runs.
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }

# Runtime
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time", "signal"] }
tokio-util = "0.7"
reqwest = { version = "0.13", features = ["stream"] }
rusqlite = { version = "0.41", features = ["bundled"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
percent-encoding = "2"
fastrand = "2"
tracing = "0.1"
clap = "4.6"
directories = "6"
bytes = "1"
futures-util = "0.3"
scraper = "0.29"
sha2 = "0.11"
hex = "0.4"
fs4 = { version = "1.1", default-features = false }
xattr = "1.6"
libc = "0.2"
windows-sys = "0.61"
dunce = "1"
keepawake = "0.6"
# Exact: the [patch.crates-io] below replaces 9.1.0 only, and a newer
# release would silently bypass it.
librqbit = { version = "=9.1.0", default-features = false, features = ["rust-tls"] }

# Tool archives (M5): reading in core, writing in the testkit's fake host.
zip = { version = "9.2", default-features = false, features = ["deflate"] }
tar = "0.4"
lzma-rust2 = { version = "0.25", default-features = false, features = ["std", "xz"] }

# Tests only
axum = "0.8"
tempfile = "3"
sha1 = "0.11"

# Patched librqbit crates; see PATCH.txt in each directory: an IPv4 fallback
# for the UDP tracker socket, and a race in the initial file check.
[patch.crates-io]
librqbit = { path = "third_party/librqbit" }
librqbit-tracker-comms = { path = "third_party/librqbit-tracker-comms" }

# Tool archives are built, unpacked and hashed in tests; unoptimized
# xz, deflate and SHA-256 take seconds there.
[profile.dev.package.lzma-rust2]
opt-level = 3
[profile.dev.package.zlib-rs]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
