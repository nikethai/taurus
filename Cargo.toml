[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.89"
license = "GPL-3.0-or-later"
repository = "https://github.com/nikethai/taurus"

[workspace.dependencies]
# Internal crates
taurus-core = { path = "crates/taurus-core" }
taurus-testkit = { path = "crates/taurus-testkit" }

# Runtime
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time", "signal"] }
tokio-util = "0.7"
reqwest = { version = "0.13", features = ["stream"] }
rusqlite = { version = "0.41", features = ["bundled"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
percent-encoding = "2"
fastrand = "2"
tracing = "0.1"
clap = "4.6"
directories = "6"
bytes = "1"
futures-util = "0.3"
scraper = "0.29"
sha2 = "0.11"
hex = "0.4"
fs4 = { version = "1.1", default-features = false }
xattr = "1.6"
libc = "0.2"
windows-sys = "0.61"
dunce = "1"
keepawake = "0.6"

# Tests only
axum = "0.8"
tempfile = "3"
