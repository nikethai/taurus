<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Taurus — When done and speed</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.tl{--bg:#FBFBFC;--bar:#F3F3F5;--panel:#FFFFFF;--line:#E3E3E8;--field:#C9C9D1;--text:#1B1B1F;--muted:#5F5F69;--chip:#ECECF0;--track:#E2E2E7;--ok:#1F7A5C;--err:#BE3328;--hover:rgba(0,0,0,.045);--input:#FFFFFF;--shadow:0 2px 6px rgba(0,0,0,.08),0 18px 44px rgba(0,0,0,.18)}
.td{--bg:#1C1C1F;--bar:#232327;--panel:#2A2A2F;--line:#3A3A41;--field:#4A4A53;--text:#ECECF0;--muted:#A2A2AD;--chip:#303036;--track:#38383F;--ok:#4CC79A;--err:#FF6B5E;--hover:rgba(255,255,255,.055);--input:#1F1F23;--shadow:0 2px 6px rgba(0,0,0,.45),0 18px 44px rgba(0,0,0,.6)}
.tl .k-disc{--kbg:#E3EDFF;--kfg:#2563C9}
.tl .k-magnet{--kbg:#DDF4EF;--kfg:#0B7160}
.tl .k-live{--kbg:#FFE5E2;--kfg:#C02B1E}
.td .k-disc{--kbg:rgba(91,143,240,.18);--kfg:#8DB2FF}
.td .k-magnet{--kbg:rgba(44,199,170,.18);--kfg:#5AD8C2}
.td .k-live{--kbg:rgba(255,107,94,.18);--kfg:#FF8A7F}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:left}
input{font:inherit;color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=radio]{accent-color:var(--accent-strong);width:15px;height:15px;margin:0;flex:none}
.i{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hv:hover{background:var(--hover)}
.num{font-variant-numeric:tabular-nums}
a{color:var(--accent-text)}a:hover{color:var(--text)}
</style>
</helmet>
<div class="{{themeClass}}" style="--accent: {{acc.base}}; --accent-strong: {{acc.strong}}; --accent-text: {{acc.text}}; --sel: {{acc.sel}}; position: relative; width: 420px; height: 640px; overflow: hidden; display: flex; flex-direction: column; background: var(--bg); color: var(--text); font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 13px; line-height: 1.4;">

<header style="flex: none; height: 44px; display: flex; align-items: center; gap: 8px; padding: 0 8px 0 14px; background: var(--bar); border-bottom: 1px solid var(--line);">
<span aria-hidden="true" style="width: 12px; height: 12px; border-radius: 50%; background: #FF5F57;"></span>
<span aria-hidden="true" style="width: 12px; height: 12px; border-radius: 50%; background: #FEBC2E;"></span>
<span aria-hidden="true" style="width: 12px; height: 12px; border-radius: 50%; background: #28C840;"></span>
<h1 style="flex: 1; margin: 0; text-align: center; font-size: 13px; font-weight: 600;">Taurus</h1>
<a href="CompactMain.dc.html" aria-label="Back to downloads" title="Back to downloads" class="hv" style="width: 32px; height: 32px; border-radius: 7px; display: flex; align-items: center; justify-content: center; color: var(--muted);"><svg class="i" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
</header>

<div aria-hidden="true" style="flex: 1; min-height: 0; padding: 12px 6px 0; display: flex; flex-direction: column; gap: 2px;">
<div style="margin: 0 6px 10px; height: 36px; border-radius: 9px; border: 1px solid var(--field); background: var(--input);"></div>
<sc-for list="{{bgRows}}" as="r" hint-placeholder-count="3">
<div class="{{r.kc}}" style="display: flex; align-items: center; gap: 10px; padding: 9px 8px;">
<span style="width: 32px; height: 32px; border-radius: 8px; background: var(--kbg); color: var(--kfg); display: flex; align-items: center; justify-content: center; flex: none;"><svg class="i" width="16" height="16" viewBox="0 0 24 24"><path d="{{r.icon}}"></path></svg></span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px;">
<span style="display: flex; gap: 8px;"><span style="flex: 1; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">{{r.name}}</span><span class="num" style="font-size: 12px; font-weight: 600; color: {{r.pctColor}};">{{r.pct}}</span></span>
<span style="display: block; height: 3px; border-radius: 2px; background: var(--track);"><span style="display: block; height: 100%; width: {{r.w}}; background: {{r.bar}};"></span></span>
<span class="num" style="font-size: 11.5px; color: var(--muted);">{{r.status}}</span>
</span>
</div>
</sc-for>
</div>

<sc-if value="{{open}}" hint-placeholder-val="{{true}}">
<section role="dialog" aria-label="When done and speed" style="position: absolute; right: 10px; bottom: 50px; width: 292px; box-sizing: border-box; padding: 14px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 12px;">
<fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 2px;">
<legend style="padding: 0; margin-bottom: 6px; font-size: 12px; font-weight: 600; color: var(--muted);">When everything finishes</legend>
<sc-for list="{{doneOpts}}" as="o" hint-placeholder-count="5">
<label class="hv" style="display: flex; align-items: center; gap: 10px; min-height: 32px; padding: 0 8px; margin: 0 -8px; border-radius: 7px;">
<input type="radio" name="whendone" checked="{{o.checked}}" onChange="{{o.pick}}">
<span style="flex: 1;">{{o.label}}</span>
<svg class="i" width="15" height="15" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--muted);"><path d="{{o.icon}}"></path></svg>
</label>
</sc-for>
<sc-if value="{{showWarn}}" hint-placeholder-val="{{false}}">
<p style="margin: 4px 0 0; font-size: 11.5px; color: var(--muted);">You get 60 seconds to cancel before it happens.</p>
</sc-if>
</fieldset>

<div style="height: 1px; background: var(--line);"></div>

<div style="display: flex; flex-direction: column; gap: 8px;">
<p id="wd-speed" style="margin: 0; font-size: 12px; font-weight: 600; color: var(--muted);">Speed</p>
<div role="group" aria-labelledby="wd-speed" style="padding: 3px; border-radius: 9px; background: var(--chip); display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 3px;">
<sc-for list="{{speeds}}" as="s" hint-placeholder-count="4">
<button onClick="{{s.pick}}" aria-pressed="{{s.pressed}}" style="height: 28px; border-radius: 7px; text-align: center; font-size: 12.5px; font-weight: {{s.weight}}; background: {{s.bg}}; color: {{s.color}}; box-shadow: {{s.shadow}};">{{s.label}}</button>
</sc-for>
</div>
<p class="num" style="margin: 0; font-size: 11.5px; color: var(--muted);">{{speedNote}}</p>
</div>
</section>
</sc-if>

<footer style="flex: none; height: 40px; display: flex; align-items: center; gap: 10px; padding: 0 8px 0 14px; border-top: 1px solid var(--line); background: var(--bar); font-size: 12px;">
<span class="num" style="font-weight: 600;"><span class="vh">Download speed </span>↓ {{down}}</span>
<span class="num" style="color: var(--muted);"><span class="vh">Upload speed </span>↑ 1.4 MB/s</span>
<button onClick="{{toggle}}" aria-expanded="{{openStr}}" class="hv" style="margin-left: auto; height: 28px; padding: 0 10px; border-radius: 7px; display: flex; align-items: center; gap: 6px; font-weight: 600; background: {{btnBg}}; color: {{btnColor}};"><svg class="i" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 14.5A7.5 7.5 0 0 1 9.5 5a7.5 7.5 0 1 0 9.5 9.5z"></path></svg>{{doneLabel}}</button>
</footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false,"section":"Theme"},"accent":{"editor":"enum","options":["Aldebaran","Cobalt","Jade","Grape","Rose","Sky"],"default":"Aldebaran","section":"Theme"},"$preview":{"width":420,"height":640}}'>
var ACC = {
  Aldebaran: { l: { base: '#E8590C', strong: '#C2410C', text: '#B3410A', sel: 'rgba(232,89,12,.08)' }, d: { base: '#FF7A2E', strong: '#C2410C', text: '#FF9A5C', sel: 'rgba(255,122,46,.14)' } },
  Cobalt: { l: { base: '#2F6FDE', strong: '#2457B8', text: '#2457B8', sel: 'rgba(47,111,222,.08)' }, d: { base: '#5B8FF0', strong: '#2F62C8', text: '#8DB2FF', sel: 'rgba(91,143,240,.15)' } },
  Jade: { l: { base: '#0F9D76', strong: '#0B7258', text: '#0B7258', sel: 'rgba(15,157,118,.08)' }, d: { base: '#2CC799', strong: '#0B7258', text: '#5ADBB3', sel: 'rgba(44,199,153,.14)' } },
  Grape: { l: { base: '#7C3AED', strong: '#6D28D9', text: '#6D28D9', sel: 'rgba(124,58,237,.08)' }, d: { base: '#A78BFA', strong: '#6D28D9', text: '#C4B5FD', sel: 'rgba(167,139,250,.15)' } },
  Rose: { l: { base: '#E11D48', strong: '#BE123C', text: '#BE123C', sel: 'rgba(225,29,72,.07)' }, d: { base: '#FB7185', strong: '#BE123C', text: '#FDA4AF', sel: 'rgba(251,113,133,.14)' } },
  Sky: { l: { base: '#0284C7', strong: '#0369A1', text: '#0369A1', sel: 'rgba(2,132,199,.08)' }, d: { base: '#38BDF8', strong: '#0369A1', text: '#7DD3FC', sel: 'rgba(56,189,248,.14)' } }
};

var DONE = [
  { id: 'none', label: 'Do nothing', short: 'When done', icon: 'M6 12h12' },
  { id: 'notify', label: 'Just notify me', short: 'Notify', icon: 'M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15zM10 20.5h4' },
  { id: 'sleep', label: 'Put the computer to sleep', short: 'Then sleep', icon: 'M19 14.5A7.5 7.5 0 0 1 9.5 5a7.5 7.5 0 1 0 9.5 9.5z' },
  { id: 'shutdown', label: 'Shut down', short: 'Then shut down', icon: 'M12 4v7M7.5 7a7 7 0 1 0 9 0' },
  { id: 'quit', label: 'Quit Taurus', short: 'Then quit', icon: 'M14 4h5v16h-5M10 8l-4 4 4 4M6 12h9' }
];
var SPEEDS = [
  { id: 'low', label: 'Low', down: '1.0 MB/s', note: 'Capped at 1 MB/s, leaves room for calls and browsing.' },
  { id: 'medium', label: 'Medium', down: '5.0 MB/s', note: 'Capped at 5 MB/s.' },
  { id: 'max', label: 'Max', down: '31.2 MB/s', note: 'No limit. Taurus uses everything it can get.' },
  { id: 'custom', label: 'Custom', down: '12.0 MB/s', note: 'Your own limit: 12 MB/s. Change it in Settings.' }
];
var BG = [
  { kc: 'k-live', icon: 'M12 10.5a1.5 1.5 0 1 0 0 3a1.5 1.5 0 1 0 0-3M8.5 8.5a5 5 0 0 0 0 7M15.5 8.5a5 5 0 0 1 0 7M5.6 5.6a9 9 0 0 0 0 12.8M18.4 5.6a9 9 0 0 1 0 12.8', name: 'Lofi beats radio — live', pct: 'LIVE', pctColor: 'var(--err)', w: '100%', bar: 'var(--err)', status: 'Recording · 1:24:07 · 612 MB' },
  { kc: 'k-disc', icon: 'M12 4a8 8 0 1 0 0 16a8 8 0 1 0 0-16M12 10a2 2 0 1 0 0 4a2 2 0 1 0 0-4', name: 'ubuntu-24.04.3-desktop-amd64.iso', pct: '62%', pctColor: 'var(--text)', w: '62%', bar: 'var(--kfg)', status: '3.8 of 6.1 GB · 2 min left' },
  { kc: 'k-magnet', icon: 'M6 4h4v7a2 2 0 0 0 4 0V4h4v7a6 6 0 0 1-12 0zM6 8h4M14 8h4', name: 'archlinux-2026.10.01-x86_64.iso', pct: '88%', pctColor: 'var(--text)', w: '88%', bar: 'var(--kfg)', status: '1.21 of 1.38 GB · 54 s left' }
];

class Component extends DCLogic {
  state = { done: 'sleep', speed: 'max', open: true };

  renderVals() {
    var self = this;
    var st = this.state;
    var dark = this.props.dark ?? false;
    var acc = (ACC[this.props.accent ?? 'Aldebaran'] || ACC.Aldebaran)[dark ? 'd' : 'l'];
    var done = DONE.find(function (d) { return d.id === st.done; });
    var sp = SPEEDS.find(function (s) { return s.id === st.speed; });
    var active = st.done !== 'none' || st.open;
    return {
      acc: acc,
      themeClass: dark ? 'td' : 'tl',
      bgRows: BG,
      open: st.open,
      openStr: st.open ? 'true' : 'false',
      toggle: function () { self.setState({ open: !self.state.open }); },
      doneOpts: DONE.map(function (d) {
        return { label: d.label, icon: d.icon, checked: d.id === st.done, pick: function () { self.setState({ done: d.id }); } };
      }),
      showWarn: st.done === 'sleep' || st.done === 'shutdown',
      speeds: SPEEDS.map(function (s) {
        var on = s.id === st.speed;
        return {
          label: s.label, pressed: on ? 'true' : 'false',
          bg: on ? 'var(--panel)' : 'transparent',
          color: on ? 'var(--text)' : 'var(--muted)',
          weight: on ? '600' : '500',
          shadow: on ? '0 1px 2px rgba(0,0,0,.14)' : 'none',
          pick: function () { self.setState({ speed: s.id }); }
        };
      }),
      speedNote: sp.note,
      down: sp.down,
      doneLabel: done.short,
      btnBg: active ? 'var(--sel)' : 'transparent',
      btnColor: active ? 'var(--accent-text)' : 'var(--muted)'
    };
  }
}
</script>
</body>
</html>
