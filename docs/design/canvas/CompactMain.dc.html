<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Taurus — Compact downloads</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.tl{--bg:#FBFBFC;--bar:#F3F3F5;--panel:#FFFFFF;--line:#E3E3E8;--field:#C9C9D1;--text:#1B1B1F;--muted:#5F5F69;--chip:#ECECF0;--track:#E2E2E7;--ok:#1F7A5C;--err:#BE3328;--hover:rgba(0,0,0,.045);--input:#FFFFFF}
.td{--bg:#1C1C1F;--bar:#232327;--panel:#26262A;--line:#323238;--field:#4A4A53;--text:#ECECF0;--muted:#A2A2AD;--chip:#2E2E34;--track:#38383F;--ok:#4CC79A;--err:#FF6B5E;--hover:rgba(255,255,255,.055);--input:#26262B}
.tl .k-disc{--kbg:#E3EDFF;--kfg:#2563C9;--kmid:#93B4F0}
.tl .k-media{--kbg:#EEE6FF;--kfg:#6B3FD4;--kmid:#BCA3F3}
.tl .k-magnet{--kbg:#DDF4EF;--kfg:#0B7160;--kmid:#86D1C1}
.tl .k-archive{--kbg:#FFF1D6;--kfg:#92580A;--kmid:#EDC36F}
.tl .k-music{--kbg:#FFE4EF;--kfg:#C0266D;--kmid:#F29BBE}
.tl .k-file{--kbg:#E8EAF2;--kfg:#4A5372;--kmid:#AEB4CA}
.td .k-disc{--kbg:rgba(91,143,240,.18);--kfg:#8DB2FF;--kmid:rgba(141,178,255,.45)}
.td .k-media{--kbg:rgba(155,120,255,.2);--kfg:#BBA4FF;--kmid:rgba(187,164,255,.45)}
.td .k-magnet{--kbg:rgba(44,199,170,.18);--kfg:#5AD8C2;--kmid:rgba(90,216,194,.45)}
.td .k-archive{--kbg:rgba(245,180,60,.18);--kfg:#F5C25C;--kmid:rgba(245,194,92,.45)}
.td .k-music{--kbg:rgba(255,100,160,.18);--kfg:#FF8DBB;--kmid:rgba(255,141,187,.45)}
.td .k-file{--kbg:rgba(160,170,210,.16);--kfg:#B4BCDB;--kmid:rgba(180,188,219,.4)}
.tl .k-live{--kbg:#FFE5E2;--kfg:#C02B1E;--kmid:#F2A49C}
.td .k-live{--kbg:rgba(255,107,94,.18);--kfg:#FF8A7F;--kmid:rgba(255,138,127,.45)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:left}
input{font:inherit;color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.i{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hv:hover{background:var(--hover)}
.num{font-variant-numeric:tabular-nums}
a{color:var(--accent-text)}a:hover{color:var(--text)}
</style>
</helmet>
<div class="{{themeClass}}" style="--accent: {{acc.base}}; --accent-strong: {{acc.strong}}; --accent-text: {{acc.text}}; --accent-soft: {{acc.soft}}; --sel: {{acc.sel}}; width: 420px; height: 640px; overflow: hidden; display: flex; flex-direction: column; background: var(--bg); color: var(--text); font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 13px; line-height: 1.4;">

<header style="flex: none; height: 44px; display: flex; align-items: center; gap: 8px; padding: 0 8px 0 14px; background: var(--bar); border-bottom: 1px solid var(--line);">
<span aria-hidden="true" style="width: 12px; height: 12px; border-radius: 50%; background: #FF5F57;"></span>
<span aria-hidden="true" style="width: 12px; height: 12px; border-radius: 50%; background: #FEBC2E;"></span>
<span aria-hidden="true" style="width: 12px; height: 12px; border-radius: 50%; background: #28C840;"></span>
<h1 style="flex: 1; margin: 0; text-align: center; font-size: 13px; font-weight: 600;">Taurus</h1>
<a href="CompactSettings.dc.html" aria-label="Settings" title="Settings" class="hv" style="width: 32px; height: 32px; border-radius: 7px; display: flex; align-items: center; justify-content: center; color: var(--muted);"><svg class="i" width="17" height="17" viewBox="0 0 24 24" aria-hidden="true"><path d="{{ic.settings}}"></path></svg></a>
</header>

<div style="flex: none; padding: 12px 12px 8px; display: flex; gap: 8px;">
<div style="flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 10px; border-radius: 9px; border: 1px solid var(--field); background: var(--input); color: var(--muted);">
<svg class="i" width="15" height="15" viewBox="0 0 24 24" aria-hidden="true"><path d="{{ic.link}}"></path></svg>
<label for="c-link" class="vh">Link to download</label>
<input id="c-link" type="url" placeholder="Paste a link or magnet" style="flex: 1; min-width: 0; border: 0; background: transparent; font-size: 13px; color: var(--text);">
</div>
<a href="CompactAdd.dc.html" style="height: 36px; padding: 0 14px; border-radius: 9px; background: var(--accent-strong); color: #FFFFFF; display: flex; align-items: center; font-weight: 600; text-decoration: none;">Add</a>
<a href="CompactBatch.dc.html" aria-label="Add several links" title="Add several links" class="hv" style="width: 36px; height: 36px; flex: none; box-sizing: border-box; border-radius: 9px; border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; color: var(--muted);"><svg class="i" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="{{ic.list}}"></path></svg></a>
</div>

<div role="tablist" aria-label="Filter" style="flex: none; margin: 0 12px 6px; padding: 3px; border-radius: 9px; background: var(--chip); display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 3px;">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
<button role="tab" aria-selected="{{t.selected}}" onClick="{{t.pick}}" style="height: 28px; border-radius: 7px; display: flex; align-items: center; justify-content: center; gap: 6px; background: {{t.bg}}; box-shadow: {{t.shadow}}; font-weight: {{t.weight}}; color: {{t.color}};">{{t.label}}<span class="num" style="font-size: 11.5px; color: var(--muted); font-weight: 500;">{{t.count}}</span></button>
</sc-for>
</div>

<section aria-label="Downloads" style="flex: 1; min-height: 0; overflow-y: auto; padding: 2px 6px 8px; display: flex; flex-direction: column; gap: 2px;">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
<div class="{{r.kc}}" style="border-radius: 10px; background: {{r.bg}};">
<div style="display: flex; align-items: center; gap: 2px; padding-right: 4px;">
<button onClick="{{r.toggle}}" aria-expanded="{{r.expanded}}" style="flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; padding: 9px 6px 9px 8px; border-radius: 10px;">
<span style="width: 32px; height: 32px; border-radius: 8px; background: var(--kbg); color: var(--kfg); display: flex; align-items: center; justify-content: center; flex: none;"><svg class="i" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="{{r.icon}}"></path></svg></span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px;">
<span style="display: flex; align-items: baseline; gap: 8px;">
<span style="flex: 1; min-width: 0; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">{{r.name}}</span>
<span class="num" style="font-size: 12px; font-weight: 600; color: {{r.pctColor}};">{{r.pctText}}</span>
</span>
<span style="display: block; height: 3px; border-radius: 2px; background: var(--track); overflow: hidden;"><span style="display: block; height: 100%; width: {{r.pct}}%; background: {{r.barColor}};"></span></span>
<span style="display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--muted); min-width: 0;">
<span class="{{r.sc}}" style="padding: 0 5px; border-radius: 4px; background: var(--kbg); color: var(--kfg); font-size: 10.5px; font-weight: 600;">{{r.sourceLabel}}</span>
<span class="num" style="min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: {{r.statusColor}};">{{r.statusText}}</span>
</span>
</span>
</button>
<button onClick="{{r.act}}" aria-label="{{r.actLabel}}" title="{{r.actLabel}}" class="hv" style="width: 32px; height: 32px; flex: none; border-radius: 7px; display: flex; align-items: center; justify-content: center; color: var(--muted);"><svg class="i" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="{{r.actIcon}}"></path></svg></button>
</div>
<sc-if value="{{r.open}}" hint-placeholder-val="{{false}}">
<div style="padding: 2px 12px 12px 50px; display: flex; flex-direction: column; gap: 10px;">
<sc-if value="{{r.hasMap}}" hint-placeholder-val="{{true}}">
<div role="img" aria-label="{{r.mapAria}}" style="display: grid; grid-template-columns: repeat(24, minmax(0, 1fr)); gap: 2px;">
<sc-for list="{{r.cells}}" as="c" hint-placeholder-count="72">
<span style="display: block; height: 7px; border-radius: 1.5px; background: {{c.color}};"></span>
</sc-for>
</div>
</sc-if>
<sc-if value="{{r.hasSteps}}" hint-placeholder-val="{{false}}">
<ol style="margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px;">
<sc-for list="{{r.steps}}" as="s" hint-placeholder-count="4">
<li style="display: flex; align-items: center; gap: 5px; color: {{s.color}};"><svg class="i" width="13" height="13" viewBox="0 0 24 24" aria-hidden="true"><path d="{{s.icon}}"></path></svg>{{s.t}}</li>
</sc-for>
</ol>
</sc-if>
<p class="num" style="margin: 0; font-size: 12px; color: var(--muted);">{{r.detail}}</p>
<p style="margin: 0; font-size: 11px; color: var(--muted); font-family: 'JetBrains Mono', ui-monospace, monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">{{r.url}}</p>
<div style="display: flex; gap: 6px;">
<button class="hv" style="height: 28px; padding: 0 10px; border-radius: 7px; border: 1px solid var(--line); display: flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 500;"><svg class="i" width="13" height="13" viewBox="0 0 24 24" aria-hidden="true"><path d="{{ic.folder}}"></path></svg>Show in folder</button>
<button class="hv" style="height: 28px; padding: 0 10px; border-radius: 7px; border: 1px solid var(--line); display: flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 500;"><svg class="i" width="13" height="13" viewBox="0 0 24 24" aria-hidden="true"><path d="{{ic.copy}}"></path></svg>Copy link</button>
<button onClick="{{r.remove}}" class="hv" style="height: 28px; padding: 0 10px; border-radius: 7px; border: 1px solid var(--line); display: flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 500; color: var(--err);"><svg class="i" width="13" height="13" viewBox="0 0 24 24" aria-hidden="true"><path d="{{ic.trash}}"></path></svg>Remove</button>
</div>
</div>
</sc-if>
</div>
</sc-for>
<sc-if value="{{empty}}" hint-placeholder-val="{{false}}">
<p style="margin: 48px 0; text-align: center; color: var(--muted);">Nothing here right now.</p>
</sc-if>
</section>

<footer style="flex: none; height: 40px; display: flex; align-items: center; gap: 14px; padding: 0 8px 0 14px; border-top: 1px solid var(--line); background: var(--bar); font-size: 12px;">
<span class="num" style="display: flex; align-items: center; gap: 4px; font-weight: 600;"><svg class="i" width="13" height="13" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--accent-text);"><path d="{{ic.arrowDown}}"></path></svg><span class="vh">Download speed</span>{{totalDown}}</span>
<span class="num" style="display: flex; align-items: center; gap: 4px; color: var(--muted);"><svg class="i" width="13" height="13" viewBox="0 0 24 24" aria-hidden="true"><path d="{{ic.up}}"></path></svg><span class="vh">Upload speed</span>1.4 MB/s</span>
<a href="CompactWhenDone.dc.html" aria-label="When done and speed" title="When done and speed" class="hv" style="margin-left: auto; width: 28px; height: 28px; border-radius: 7px; display: flex; align-items: center; justify-content: center; color: var(--muted);"><svg class="i" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="{{ic.moon}}"></path></svg></a>
<button onClick="{{pauseAll}}" class="hv" style=" height: 28px; padding: 0 10px; border-radius: 7px; display: flex; align-items: center; gap: 5px; color: var(--muted); font-weight: 500;"><svg class="i" width="13" height="13" viewBox="0 0 24 24" aria-hidden="true"><path d="{{allIcon}}"></path></svg>{{allLabel}}</button>
</footer>
</div>
</x-dc>

class Component extends DCLogic {
  state = { tab: 'active', open: 'ubuntu', over: {}, removed: {} };

  setStatus(id, s) { var o = Object.assign({}, this.state.over); o[id] = s; this.setState({ over: o }); }

  cells(it) {
    var out = [];
    for (var c = 0; c < 72; c++) {
      var done = false, active = false;
      if (it.status === 'done') done = true;
      else if (it.status === 'queued' || it.status === 'failed') done = false;
      else if (it.source === 'torrent') {
        var h = ((c * 73 + 11) % 97) / 97 * 100;
        done = h < it.pct;
        active = !done && it.status === 'downloading' && h < it.pct + 4;
      } else {
        var seg = Math.floor(c / 6);
        var j = (((seg * 37) % 11) - 5) / 30;
        var k = Math.round(Math.max(0, Math.min(1, it.pct / 100 + j)) * 6);
        done = c % 6 < k;
        active = c % 6 === k && it.status === 'downloading';
      }
      var color = 'var(--track)';
      if (done) color = it.status === 'done' ? 'var(--ok)' : (it.status === 'paused' ? 'var(--muted)' : this._fill);
      else if (active) color = this._soft;
      out.push({ color: color });
    }
    return out;
  }

  renderVals() {
    var self = this;
    var st = this.state;
    var dark = this.props.dark ?? false;
    var acc = (ACC[this.props.accent ?? 'Aldebaran'] || ACC.Aldebaran)[dark ? 'd' : 'l'];
    var byType = (this.props.progress ?? 'By type') === 'By type';
    this._fill = byType ? 'var(--kfg)' : 'var(--accent)';
    this._soft = byType ? 'var(--kmid)' : 'var(--accent-soft)';
    var items = ITEMS.filter(function (it) { return !st.removed[it.id]; }).map(function (it) {
      return Object.assign({}, it, { status: st.over[it.id] || it.status });
    });
    var tab = TABS.find(function (t) { return t.id === st.tab; });
    var list = items.filter(function (it) { return tab.test(it.status); });

    var rows = list.map(function (it) {
      var open = st.open === it.id;
      var act, actIcon, actLabel, statusText, pctText;
      if (it.status === 'recording') { actIcon = IC.stop; actLabel = 'Stop recording'; act = function () { self.setStatus(it.id, 'done'); }; statusText = 'Recording · ' + it.elapsed + ' · ' + it.size; pctText = 'LIVE'; }
      else if (it.status === 'downloading') { actIcon = IC.pause; actLabel = 'Pause'; act = function () { self.setStatus(it.id, 'paused'); }; statusText = it.speed.toFixed(1) + ' MB/s · ' + it.eta + ' left · ' + it.done + ' of ' + it.total; pctText = it.pct + '%'; }
      else if (it.status === 'paused') { actIcon = IC.play; actLabel = 'Resume'; act = function () { self.setStatus(it.id, 'downloading'); }; statusText = 'Paused · ' + it.done + ' of ' + it.total; pctText = it.pct + '%'; }
      else if (it.status === 'queued') { actIcon = IC.play; actLabel = 'Start now'; act = function () { self.setStatus(it.id, 'downloading'); }; statusText = 'Queued · ' + it.total; pctText = ''; }
      else if (it.status === 'failed') { actIcon = IC.retry; actLabel = 'Retry'; act = function () { self.setStatus(it.id, 'queued'); }; statusText = it.err; pctText = 'Failed'; }
      else { actIcon = IC.folder; actLabel = 'Show in folder'; act = function () {}; statusText = it.total + ' · ' + it.when; pctText = ''; }
      var steps = (it.steps || []).map(function (s) {
        var state = s[1];
        if (state === 'active' && it.status === 'paused') state = 'pending';
        if (it.status === 'done') state = 'done';
        return { t: s[0], icon: state === 'done' ? IC.check : state === 'active' ? IC.arrowDown : IC.clock, color: state === 'done' ? 'var(--ok)' : state === 'active' ? 'var(--accent-text)' : 'var(--muted)' };
      });
      return {
        name: it.name, icon: IC[it.kind], pct: it.pct, pctText: pctText,
        pctColor: (it.status === 'failed' || it.status === 'recording') ? 'var(--err)' : 'var(--text)',
        barColor: it.status === 'downloading' ? self._fill : BAR[it.status], sourceLabel: SRC[it.source],
        kc: 'k-' + it.kind, sc: 'k-' + SRCK[it.source],
        statusText: statusText, statusColor: (it.status === 'failed' || it.status === 'recording') ? 'var(--err)' : 'var(--muted)',
        bg: open ? 'var(--sel)' : 'transparent', open: open, expanded: open ? 'true' : 'false',
        toggle: function () { self.setState({ open: open ? null : it.id }); },
        act: act, actIcon: actIcon, actLabel: actLabel,
        hasMap: it.source !== 'media', hasSteps: it.source === 'media',
        mapAria: it.pct + '% of the file downloaded',
        cells: open && it.source !== 'media' ? self.cells(it) : [],
        steps: steps, detail: it.detail, url: it.url,
        remove: function () { var r = Object.assign({}, st.removed); r[it.id] = true; self.setState({ removed: r }); }
      };
    });

    var active = items.filter(function (it) { return it.status === 'downloading'; });
    var anyActive = active.length > 0;
    return {
      ic: IC, acc: acc, themeClass: dark ? 'td' : 'tl',
      tabs: TABS.map(function (t) {
        var on = t.id === st.tab;
        return { label: t.label, count: items.filter(function (it) { return t.test(it.status); }).length, selected: on ? 'true' : 'false', pick: function () { self.setState({ tab: t.id }); }, bg: on ? 'var(--panel)' : 'transparent', shadow: on ? '0 1px 2px rgba(0,0,0,.12)' : 'none', weight: on ? '600' : '500', color: on ? 'var(--text)' : 'var(--muted)' };
      }),
      rows: rows, empty: rows.length === 0,
      totalDown: active.reduce(function (s, it) { return s + it.speed; }, 0).toFixed(1) + ' MB/s',
      allIcon: anyActive ? IC.pause : IC.play,
      allLabel: anyActive ? 'Pause all' : 'Resume all',
      pauseAll: function () {
        var o = Object.assign({}, st.over);
        items.forEach(function (it) {
          if (anyActive && it.status === 'downloading') o[it.id] = 'paused';
          if (!anyActive && it.status === 'paused') o[it.id] = 'downloading';
        });
        self.setState({ over: o });
      }
    };
  }
}
</script>
</body>
</html>
