<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Taurus — Links on a page</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.tl{--bg:#FBFBFC;--bar:#F3F3F5;--panel:#FFFFFF;--line:#E3E3E8;--field:#C9C9D1;--text:#1B1B1F;--muted:#5F5F69;--chip:#ECECF0;--track:#E2E2E7;--off:#8E8E99;--ok:#1F7A5C;--err:#BE3328;--hover:rgba(0,0,0,.045);--input:#FFFFFF}
.td{--bg:#1C1C1F;--bar:#232327;--panel:#26262A;--line:#34343A;--field:#4A4A53;--text:#ECECF0;--muted:#A2A2AD;--chip:#303036;--track:#38383F;--off:#6E6E79;--ok:#4CC79A;--err:#FF6B5E;--hover:rgba(255,255,255,.055);--input:#1F1F23}
.tl .k-media{--kbg:#EEE6FF;--kfg:#6B3FD4}
.tl .k-archive{--kbg:#FFF1D6;--kfg:#92580A}
.tl .k-image{--kbg:#E4F4DA;--kfg:#3B6D11}
.tl .k-file{--kbg:#E8EAF2;--kfg:#4A5372}
.tl .k-disc{--kbg:#E3EDFF;--kfg:#2563C9}
.td .k-media{--kbg:rgba(155,120,255,.2);--kfg:#BBA4FF}
.td .k-archive{--kbg:rgba(245,180,60,.18);--kfg:#F5C25C}
.td .k-image{--kbg:rgba(120,200,80,.18);--kfg:#93D96B}
.td .k-file{--kbg:rgba(160,170,210,.16);--kfg:#B4BCDB}
.td .k-disc{--kbg:rgba(91,143,240,.18);--kfg:#8DB2FF}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:left}
input{font:inherit;color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=checkbox]{accent-color:var(--accent-strong);width:15px;height:15px;margin:0;flex:none}
input.sw{appearance:none;-webkit-appearance:none;width:32px;height:20px;border-radius:10px;background:var(--off);position:relative;cursor:pointer;margin:0;flex:none;transition:background .15s}
input.sw::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:#FFFFFF;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform .15s}
input.sw:checked{background:var(--accent-strong)}
input.sw:checked::after{transform:translateX(12px)}
.i{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hv:hover{background:var(--hover)}
.num{font-variant-numeric:tabular-nums}
a{color:var(--accent-text)}a:hover{color:var(--text)}
</style>
</helmet>
<div class="{{themeClass}}" style="--accent: {{acc.base}}; --accent-strong: {{acc.strong}}; --accent-text: {{acc.text}}; --sel: {{acc.sel}}; width: 420px; height: 640px; overflow: hidden; display: flex; flex-direction: column; background: var(--bg); color: var(--text); font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 13px; line-height: 1.4;">

<header style="flex: none; height: 44px; display: flex; align-items: center; gap: 8px; padding: 0 8px 0 14px; background: var(--bar); border-bottom: 1px solid var(--line);">
<span aria-hidden="true" style="width: 12px; height: 12px; border-radius: 50%; background: #FF5F57;"></span>
<span aria-hidden="true" style="width: 12px; height: 12px; border-radius: 50%; background: #FEBC2E;"></span>
<span aria-hidden="true" style="width: 12px; height: 12px; border-radius: 50%; background: #28C840;"></span>
<h1 style="flex: 1; margin: 0; text-align: center; font-size: 13px; font-weight: 600;">Links on this page</h1>
<a href="CompactMain.dc.html" aria-label="Close" title="Close" class="hv" style="width: 32px; height: 32px; border-radius: 7px; display: flex; align-items: center; justify-content: center; color: var(--muted);"><svg class="i" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
</header>

<div style="flex: none; padding: 12px 12px 8px; display: flex; flex-direction: column; gap: 8px;">
<label for="cg-page" class="vh">Page link</label>
<input id="cg-page" type="url" value="https://files.example.org/conf-2026/" readonly style="height: 34px; box-sizing: border-box; padding: 0 10px; border-radius: 9px; border: 1px solid var(--field); background: var(--input); font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px;">
<p class="num k-disc" style="margin: 0; display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted);"><span style="padding: 0 6px; border-radius: 4px; background: var(--kbg); color: var(--kfg); font-size: 10.5px; font-weight: 600;">Page</span>18 files on this page and in 4 subfolders</p>
</div>

<div role="group" aria-label="File type" style="flex: none; display: flex; gap: 6px; padding: 0 12px 8px; overflow-x: auto;">
<sc-for list="{{chips}}" as="c" hint-placeholder-count="5">
<button onClick="{{c.pick}}" aria-pressed="{{c.pressed}}" class="{{c.kc}}" style="flex: none; height: 28px; padding: 0 10px; border-radius: 14px; border: 1px solid {{c.border}}; background: {{c.bg}}; color: {{c.color}}; font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 5px;">{{c.label}}<span class="num" style="font-weight: 500; opacity: .8;">{{c.count}}</span></button>
</sc-for>
</div>

<div style="flex: none; display: flex; align-items: center; gap: 10px; padding: 0 12px 8px;">
<label for="cg-ext" class="vh">Only these extensions</label>
<input id="cg-ext" type="text" placeholder="Only .pdf, .zip …" value="{{ext}}" onChange="{{onExt}}" style="flex: 1; min-width: 0; height: 30px; box-sizing: border-box; padding: 0 10px; border-radius: 8px; border: 1px solid var(--field); background: var(--input); font-size: 12.5px;">
<label for="cg-sub" style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); white-space: nowrap;">Subfolders</label>
<input id="cg-sub" class="sw" type="checkbox" role="switch" checked="{{sub}}" onChange="{{tSub}}">
</div>

<section aria-label="Found files" style="flex: 1; min-height: 0; margin: 0 12px; border: 1px solid var(--line); border-radius: 11px; background: var(--panel); display: flex; flex-direction: column; overflow: hidden;">
<label style="flex: none; display: flex; align-items: center; gap: 10px; min-height: 36px; padding: 0 12px; border-bottom: 1px solid var(--line); font-size: 12px; font-weight: 600; color: var(--muted);"><input type="checkbox" checked="{{allVisible}}" onChange="{{toggleVisible}}">Select all shown<span class="num" style="margin-left: auto; font-weight: 500;">{{shownCount}} shown</span></label>
<ul style="flex: 1; min-height: 0; overflow-y: auto; margin: 0; padding: 4px 0; list-style: none;">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="8">
<li class="{{r.kc}}">
<label class="hv" style="display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 0 12px;">
<input type="checkbox" checked="{{r.checked}}" onChange="{{r.toggle}}">
<span style="width: 24px; height: 24px; border-radius: 6px; background: var(--kbg); color: var(--kfg); display: flex; align-items: center; justify-content: center; flex: none;"><svg class="i" width="13" height="13" viewBox="0 0 24 24" aria-hidden="true"><path d="{{r.icon}}"></path></svg></span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column;">
<span style="font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">{{r.name}}</span>
<span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10.5px; color: var(--muted);">{{r.folder}}</span>
</span>
<span class="num" style="font-size: 12px; color: var(--muted);">{{r.size}}</span>
</label>
</li>
</sc-for>
<sc-if value="{{empty}}" hint-placeholder-val="{{false}}">
<li style="padding: 32px 12px; text-align: center; color: var(--muted);">No files match that filter.</li>
</sc-if>
</ul>
</section>

<footer style="flex: none; margin-top: 10px; display: flex; align-items: center; gap: 6px; padding: 10px 12px; border-top: 1px solid var(--line); background: var(--bar);">
<span class="num" style="margin-right: auto; font-size: 12px; color: var(--muted);">{{selCount}} selected · {{selSize}}</span>
<a href="CompactMain.dc.html" class="hv" style="height: 32px; padding: 0 12px; border-radius: 8px; display: flex; align-items: center; color: var(--text); text-decoration: none; font-weight: 500;">Cancel</a>
<a href="CompactMain.dc.html" style="height: 32px; padding: 0 14px; border-radius: 8px; background: var(--accent-strong); display: flex; align-items: center; gap: 5px; color: #FFFFFF; text-decoration: none; font-weight: 600;"><svg class="i" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 10.5l5 5 5-5M5 20h14"></path></svg>Download {{selCount}}</a>
</footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false,"section":"Theme"},"accent":{"editor":"enum","options":["Aldebaran","Cobalt","Jade","Grape","Rose","Sky"],"default":"Aldebaran","section":"Theme"},"$preview":{"width":420,"height":640}}'>
var ACC = {
  Aldebaran: { l: { base: '#E8590C', strong: '#C2410C', text: '#B3410A', sel: 'rgba(232,89,12,.08)' }, d: { base: '#FF7A2E', strong: '#C2410C', text: '#FF9A5C', sel: 'rgba(255,122,46,.14)' } },
  Cobalt: { l: { base: '#2F6FDE', strong: '#2457B8', text: '#2457B8', sel: 'rgba(47,111,222,.08)' }, d: { base: '#5B8FF0', strong: '#2F62C8', text: '#8DB2FF', sel: 'rgba(91,143,240,.15)' } },
  Jade: { l: { base: '#0F9D76', strong: '#0B7258', text: '#0B7258', sel: 'rgba(15,157,118,.08)' }, d: { base: '#2CC799', strong: '#0B7258', text: '#5ADBB3', sel: 'rgba(44,199,153,.14)' } },
  Grape: { l: { base: '#7C3AED', strong: '#6D28D9', text: '#6D28D9', sel: 'rgba(124,58,237,.08)' }, d: { base: '#A78BFA', strong: '#6D28D9', text: '#C4B5FD', sel: 'rgba(167,139,250,.15)' } },
  Rose: { l: { base: '#E11D48', strong: '#BE123C', text: '#BE123C', sel: 'rgba(225,29,72,.07)' }, d: { base: '#FB7185', strong: '#BE123C', text: '#FDA4AF', sel: 'rgba(251,113,133,.14)' } },
  Sky: { l: { base: '#0284C7', strong: '#0369A1', text: '#0369A1', sel: 'rgba(2,132,199,.08)' }, d: { base: '#38BDF8', strong: '#0369A1', text: '#7DD3FC', sel: 'rgba(56,189,248,.14)' } }
};

var TYPES = {
  video: { label: 'Video', kc: 'k-media', icon: 'M5 5h14a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zM10 9v6l5-3z' },
  doc: { label: 'Docs', kc: 'k-file', icon: 'M7 3.5h7l4.5 4.5v12.5H7zM14 3.5V8h4.5' },
  archive: { label: 'Archives', kc: 'k-archive', icon: 'M4 5h16v4H4zM5.5 9v10h13V9M10 13h4' },
  image: { label: 'Images', kc: 'k-image', icon: 'M4 5h16v14H4zM4 15l4.5-4.5 4 4 2.5-2.5L20 17M15.5 8.5v.01' }
};

var LINKS = [
  { id: 1, name: 'keynote-recording.mp4', type: 'video', folder: '/talks/', mb: 1400 },
  { id: 2, name: 'panel-discussion.mp4', type: 'video', folder: '/talks/', mb: 980 },
  { id: 3, name: 'workshop-part-1.mp4', type: 'video', folder: '/workshops/', mb: 1100 },
  { id: 4, name: 'workshop-part-2.mp4', type: 'video', folder: '/workshops/', mb: 1200 },
  { id: 5, name: 'slides-keynote.pdf', type: 'doc', folder: '/slides/', mb: 12 },
  { id: 6, name: 'slides-rust-async.pdf', type: 'doc', folder: '/slides/', mb: 8.4 },
  { id: 7, name: 'slides-tauri-apps.pdf', type: 'doc', folder: '/slides/', mb: 6.1 },
  { id: 8, name: 'schedule.pdf', type: 'doc', folder: '/', mb: 0.42 },
  { id: 9, name: 'speaker-bios.pdf', type: 'doc', folder: '/', mb: 1.1 },
  { id: 10, name: 'sponsor-guide.pdf', type: 'doc', folder: '/', mb: 3.2 },
  { id: 11, name: 'attendee-handbook.pdf', type: 'doc', folder: '/', mb: 2.4 },
  { id: 12, name: 'demo-code.zip', type: 'archive', folder: '/workshops/', mb: 24 },
  { id: 13, name: 'datasets.tar.gz', type: 'archive', folder: '/workshops/', mb: 310 },
  { id: 14, name: 'press-kit.zip', type: 'archive', folder: '/press/', mb: 88 },
  { id: 15, name: 'photo-stage.jpg', type: 'image', folder: '/press/', mb: 6.2 },
  { id: 16, name: 'photo-crowd.jpg', type: 'image', folder: '/press/', mb: 5.8 },
  { id: 17, name: 'logo-pack.png', type: 'image', folder: '/press/', mb: 2.0 },
  { id: 18, name: 'banner.png', type: 'image', folder: '/', mb: 1.4 }
];

function fmt(mb) {
  if (mb >= 1000) return (mb / 1000).toFixed(2) + ' GB';
  if (mb >= 10) return Math.round(mb) + ' MB';
  if (mb >= 1) return mb.toFixed(1) + ' MB';
  if (mb <= 0) return '0 MB';
  return Math.round(mb * 1000) + ' KB';
}

class Component extends DCLogic {
  state = { filter: 'all', sel: { 1: true, 2: true, 3: true, 4: true }, ext: '', sub: true };

  renderVals() {
    var self = this;
    var st = this.state;
    var dark = this.props.dark ?? false;
    var acc = (ACC[this.props.accent ?? 'Aldebaran'] || ACC.Aldebaran)[dark ? 'd' : 'l'];
    var exts = st.ext.split(/[\s,]+/).map(function (e) { return e.trim().toLowerCase().replace(/^\./, ''); }).filter(Boolean);
    var pool = LINKS.filter(function (l) { return st.sub || l.folder === '/'; });
    var shown = pool.filter(function (l) {
      if (st.filter !== 'all' && l.type !== st.filter) return false;
      if (exts.length && !exts.some(function (e) { return l.name.toLowerCase().endsWith('.' + e); })) return false;
      return true;
    });
    var chipIds = ['all', 'video', 'doc', 'archive', 'image'];
    var selected = pool.filter(function (l) { return st.sel[l.id]; });
    var allVisible = shown.length > 0 && shown.every(function (l) { return st.sel[l.id]; });
    return {
      acc: acc,
      themeClass: dark ? 'td' : 'tl',
      chips: chipIds.map(function (id) {
        var on = st.filter === id;
        var t = TYPES[id];
        return {
          label: t ? t.label : 'All',
          kc: t ? t.kc : '',
          count: id === 'all' ? pool.length : pool.filter(function (l) { return l.type === id; }).length,
          pressed: on ? 'true' : 'false',
          bg: on ? (t ? 'var(--kbg)' : 'var(--sel)') : 'transparent',
          color: on ? (t ? 'var(--kfg)' : 'var(--accent-text)') : 'var(--text)',
          border: on ? (t ? 'var(--kfg)' : 'var(--accent)') : 'var(--line)',
          pick: function () { self.setState({ filter: id }); }
        };
      }),
      ext: st.ext,
      onExt: function (e) { self.setState({ ext: e.target.value }); },
      sub: st.sub,
      tSub: function () { self.setState({ sub: !self.state.sub }); },
      rows: shown.map(function (l) {
        var t = TYPES[l.type];
        return {
          name: l.name, folder: l.folder, size: fmt(l.mb), kc: t.kc, icon: t.icon,
          checked: !!st.sel[l.id],
          toggle: function () { var o = Object.assign({}, self.state.sel); o[l.id] = !o[l.id]; self.setState({ sel: o }); }
        };
      }),
      empty: shown.length === 0,
      shownCount: shown.length,
      allVisible: allVisible,
      toggleVisible: function () {
        var o = Object.assign({}, self.state.sel);
        shown.forEach(function (l) { o[l.id] = !allVisible; });
        self.setState({ sel: o });
      },
      selCount: selected.length,
      selSize: fmt(selected.reduce(function (s, l) { return s + l.mb; }, 0))
    };
  }
}
</script>
</body>
</html>
