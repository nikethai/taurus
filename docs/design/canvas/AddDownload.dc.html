<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Taurus — New download</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.tl{--bg:#FBFBFC;--scrim:#D6D6DC;--panel:#FFFFFF;--line:#E3E3E8;--field:#C9C9D1;--text:#1B1B1F;--muted:#5F5F69;--chip:#ECECF0;--track:#E4E4E9;--ok:#1F7A5C;--hover:rgba(0,0,0,.045);--input:#FFFFFF;--shadow:0 1px 2px rgba(0,0,0,.08),0 24px 64px rgba(0,0,0,.18)}
.td{--bg:#1B1B1E;--scrim:#111113;--panel:#232327;--line:#34343A;--field:#4A4A53;--text:#ECECF0;--muted:#A2A2AD;--chip:#2E2E34;--track:#38383F;--ok:#4CC79A;--hover:rgba(255,255,255,.055);--input:#1C1C20;--shadow:0 1px 2px rgba(0,0,0,.5),0 24px 64px rgba(0,0,0,.55)}
.tl .k-media{--kbg:#EEE6FF;--kfg:#6B3FD4}
.td .k-media{--kbg:rgba(155,120,255,.2);--kfg:#BBA4FF}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:left}
input,select{font:inherit;color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=checkbox]{accent-color:var(--accent-strong);width:16px;height:16px;margin:0}
.i{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hv:hover{background:var(--hover)}
.num{font-variant-numeric:tabular-nums}
a{color:var(--accent-text)}a:hover{color:var(--text)}
</style>
</helmet>
<div class="{{themeClass}}" style="--accent: {{acc.base}}; --accent-strong: {{acc.strong}}; --accent-text: {{acc.text}}; --sel: {{acc.sel}}; min-height: 100vh; box-sizing: border-box; padding: 48px 16px; display: flex; align-items: center; justify-content: center; background: var(--scrim); color: var(--text); font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 13px; line-height: 1.4;">

<section role="dialog" aria-modal="true" aria-labelledby="nd-title" style="width: 100%; max-width: 620px; background: var(--panel); border-radius: 14px; box-shadow: var(--shadow); border: 1px solid var(--line); display: flex; flex-direction: column;">

<header style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 20px 6px 24px;">
<h1 id="nd-title" style="margin: 0; font-size: 17px; font-weight: 600; letter-spacing: -0.01em;">New download</h1>
<a href="Main.dc.html" aria-label="Close" class="hv" style="width: 34px; height: 34px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: var(--muted);"><svg class="i" width="17" height="17" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
</header>

<div style="padding: 10px 24px 22px; display: flex; flex-direction: column; gap: 20px;">

<div style="display: flex; flex-direction: column; gap: 8px;">
<label for="nd-link" style="font-weight: 600;">Link</label>
<div style="display: flex; gap: 8px;">
<input id="nd-link" type="url" value="https://www.youtube.com/watch?v=…" readonly style="flex: 1; min-width: 0; height: 38px; box-sizing: border-box; padding: 0 12px; border-radius: 8px; border: 1px solid var(--field); background: var(--input); font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12.5px;">
<button class="hv" style="height: 38px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line); font-weight: 500;">Paste</button>
</div>
<p style="margin: 0; display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px;">
<svg class="i" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--ok);"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
<span class="k-media" style="display: flex; align-items: center; gap: 8px;"><span style="padding: 1px 7px; border-radius: 4px; background: var(--kbg); color: var(--kfg); font-size: 11px; font-weight: 600;">yt-dlp</span>YouTube video · merged with ffmpeg</span>
</p>
</div>

<div style="display: flex; gap: 14px; align-items: center; padding: 12px; border-radius: 10px; background: var(--chip);">
<div role="img" aria-label="Video thumbnail placeholder" class="k-media" style="width: 128px; height: 72px; border-radius: 7px; background: var(--kbg); flex: none; display: flex; align-items: center; justify-content: center; color: var(--kfg); font-size: 11px;">Thumbnail</div>
<div style="min-width: 0;">
<p style="margin: 0; font-weight: 600; font-size: 14px;">Sprite Fright — Blender Open Movie</p>
<p class="num" style="margin: 3px 0 0; color: var(--muted); font-size: 12px;">Blender Studio · 10:24 · up to 2160p</p>
</div>
</div>

<fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 8px;">
<legend style="padding: 0; margin-bottom: 8px; font-weight: 600;">Quality</legend>
<div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px;">
<sc-for list="{{qualities}}" as="o" hint-placeholder-count="5">
<button onClick="{{o.pick}}" aria-pressed="{{o.pressed}}" style="display: flex; flex-direction: column; gap: 2px; padding: 9px 10px; min-height: 52px; box-sizing: border-box; border-radius: 9px; border: 1.5px solid {{o.border}}; background: {{o.bg}};">
<span style="font-weight: 600; color: {{o.color}};">{{o.label}}</span>
<span class="num" style="font-size: 11.5px; color: var(--muted);">{{o.size}}</span>
</button>
</sc-for>
</div>
</fieldset>

<div style="display: flex; flex-wrap: wrap; gap: 16px 24px;">
<div style="flex: 1 1 200px; display: flex; flex-direction: column; gap: 8px;">
<label for="nd-format" style="font-weight: 600;">Format</label>
<sc-if value="{{isVideo}}" hint-placeholder-val="{{true}}">
<select id="nd-format" value="{{fmt}}" onChange="{{onFmt}}" style="height: 36px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--field); background: var(--input);">
<option value="mp4">MP4 · plays everywhere</option>
<option value="mkv">MKV · keeps original streams</option>
<option value="webm">WebM</option>
</select>
</sc-if>
<sc-if value="{{isAudio}}" hint-placeholder-val="{{false}}">
<select id="nd-format" value="m4a" style="height: 36px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--field); background: var(--input);">
<option value="m4a">M4A · AAC</option>
</select>
</sc-if>
</div>
<div style="flex: 1 1 200px; display: flex; flex-direction: column; gap: 10px; padding-top: 2px;">
<span style="font-weight: 600;">Extras</span>
<label style="display: flex; align-items: center; gap: 8px;"><input type="checkbox" checked="{{subs}}" onChange="{{toggleSubs}}">English subtitles</label>
<label style="display: flex; align-items: center; gap: 8px;"><input type="checkbox" checked="{{embed}}" onChange="{{toggleEmbed}}">Embed thumbnail and chapters</label>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 8px;">
<label for="nd-name" style="font-weight: 600;">Save as</label>
<input id="nd-name" type="text" value="{{fileName}}" readonly style="height: 36px; box-sizing: border-box; padding: 0 12px; border-radius: 8px; border: 1px solid var(--field); background: var(--input);">
<div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap;">
<span style="display: flex; align-items: center; gap: 6px; font-weight: 500;"><svg class="i" width="15" height="15" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--muted);"><path d="M3.5 7V18a1.5 1.5 0 0 0 1.5 1.5h14a1.5 1.5 0 0 0 1.5-1.5V9a1.5 1.5 0 0 0-1.5-1.5h-7L10 5H5a1.5 1.5 0 0 0-1.5 1.5z"></path></svg>{{folder}}</span>
<button style="color: var(--accent-text); font-weight: 500; min-height: 28px;">Change…</button>
<span class="num" style="margin-left: auto; color: var(--muted); font-size: 12px;">≈ {{size}} · 212 GB free</span>
</div>
</div>
</div>

<footer style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 14px 20px 14px 24px; border-top: 1px solid var(--line);">
<label style="display: flex; align-items: center; gap: 8px; margin-right: auto; color: var(--muted);"><input type="checkbox" checked="{{startNow}}" onChange="{{toggleStart}}">Start immediately</label>
<a href="Main.dc.html" class="hv" style="height: 36px; padding: 0 14px; border-radius: 8px; display: flex; align-items: center; color: var(--text); text-decoration: none; font-weight: 500;">Cancel</a>
<a href="Main.dc.html" class="hv" style="height: 36px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line); display: flex; align-items: center; color: var(--text); text-decoration: none; font-weight: 500;">Add to queue</a>
<a href="Main.dc.html" style="height: 36px; padding: 0 16px; border-radius: 8px; background: var(--accent-strong); display: flex; align-items: center; gap: 6px; color: #FFFFFF; text-decoration: none; font-weight: 600;"><svg class="i" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 10.5l5 5 5-5M5 20h14"></path></svg>Download</a>
</footer>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false,"section":"Theme"},"accent":{"editor":"enum","options":["Aldebaran","Cobalt","Jade","Grape","Rose","Sky"],"default":"Aldebaran","section":"Theme"},"$preview":{"width":1280,"height":800}}'>
var ACC = {
  Grape: { l: { base: '#7C3AED', strong: '#6D28D9', text: '#6D28D9', sel: 'rgba(124,58,237,.08)' }, d: { base: '#A78BFA', strong: '#6D28D9', text: '#C4B5FD', sel: 'rgba(167,139,250,.15)' } },
  Rose: { l: { base: '#E11D48', strong: '#BE123C', text: '#BE123C', sel: 'rgba(225,29,72,.07)' }, d: { base: '#FB7185', strong: '#BE123C', text: '#FDA4AF', sel: 'rgba(251,113,133,.14)' } },
  Sky: { l: { base: '#0284C7', strong: '#0369A1', text: '#0369A1', sel: 'rgba(2,132,199,.08)' }, d: { base: '#38BDF8', strong: '#0369A1', text: '#7DD3FC', sel: 'rgba(56,189,248,.14)' } },
  Aldebaran: {
    l: { base: '#E8590C', strong: '#C2410C', text: '#B3410A', sel: 'rgba(232,89,12,.08)' },
    d: { base: '#FF7A2E', strong: '#C2410C', text: '#FF9A5C', sel: 'rgba(255,122,46,.14)' }
  },
  Cobalt: {
    l: { base: '#2F6FDE', strong: '#2457B8', text: '#2457B8', sel: 'rgba(47,111,222,.08)' },
    d: { base: '#5B8FF0', strong: '#2F62C8', text: '#8DB2FF', sel: 'rgba(91,143,240,.15)' }
  },
  Jade: {
    l: { base: '#0F9D76', strong: '#0B7258', text: '#0B7258', sel: 'rgba(15,157,118,.08)' },
    d: { base: '#2CC799', strong: '#0B7258', text: '#5ADBB3', sel: 'rgba(44,199,153,.14)' }
  }
};

var QUALITIES = [
  { id: '2160p', label: '2160p', size: '1.98 GB' },
  { id: '1440p', label: '1440p', size: '1.12 GB' },
  { id: '1080p', label: '1080p', size: '642 MB' },
  { id: '720p', label: '720p', size: '318 MB' },
  { id: 'audio', label: 'Audio', size: '18 MB' }
];

class Component extends DCLogic {
  state = { quality: '2160p', fmt: 'mp4', subs: true, embed: true, startNow: true };

  renderVals() {
    var self = this;
    var st = this.state;
    var dark = this.props.dark ?? false;
    var acc = (ACC[this.props.accent ?? 'Aldebaran'] || ACC.Aldebaran)[dark ? 'd' : 'l'];
    var audio = st.quality === 'audio';
    var q = QUALITIES.find(function (x) { return x.id === st.quality; });
    var base = 'Sprite Fright — Blender Open Movie';
    var flip = function (key) { return function () { var o = {}; o[key] = !self.state[key]; self.setState(o); }; };
    return {
      acc: acc,
      themeClass: dark ? 'td' : 'tl',
      qualities: QUALITIES.map(function (o) {
        var on = o.id === st.quality;
        return {
          label: o.label,
          size: o.size,
          pressed: on ? 'true' : 'false',
          border: on ? 'var(--accent)' : 'var(--line)',
          bg: on ? 'var(--sel)' : 'transparent',
          color: on ? 'var(--accent-text)' : 'var(--text)',
          pick: function () { self.setState({ quality: o.id }); }
        };
      }),
      isVideo: !audio,
      isAudio: audio,
      fmt: st.fmt,
      onFmt: function (e) { self.setState({ fmt: e.target.value }); },
      subs: st.subs,
      embed: st.embed,
      startNow: st.startNow,
      toggleSubs: flip('subs'),
      toggleEmbed: flip('embed'),
      toggleStart: flip('startNow'),
      fileName: audio ? base + '.m4a' : base + ' (' + q.label + ').' + st.fmt,
      folder: audio ? '~/Music' : '~/Movies',
      size: q.size
    };
  }
}
</script>
</body>
</html>
