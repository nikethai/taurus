# Windows: the NSIS installer. `cargo packager -c packaging/packager-windows.toml`
# from the repo root; see packaging/README.md. The first block repeats
# packager-common.toml. No deep links or file associations (D4).
name = "hyades"
version = "0.1.0"
product-name = "Hyades"
identifier = "dev.nikethai.hyades"
publisher = "nikethai"
authors = ["nikethai"]
description = "Download files, videos and torrents."
long-description = "Hyades downloads files, videos and torrents. It splits big downloads into parts, resumes after a crash, and keeps going in the background."
homepage = "https://github.com/nikethai/taurus"
license-file = "../LICENSE"
icons = ["icons/*.png"]
category = "Utility"
binaries-dir = "../target/release"
binaries = [{ path = "hyades", main = true }]
formats = ["nsis"]

[nsis]
installer-mode = "currentUser"
installer-icon = "icons/hyades.ico"
# Empty: the uninstaller never offers to delete the downloads data.
appdata-paths = []

[windows]
allow-downgrades = false
